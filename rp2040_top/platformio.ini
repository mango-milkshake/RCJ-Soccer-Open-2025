[platformio]
default_envs = main

[env]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
board = rpipico

framework = arduino

monitor_speed = 115200

upload_protocol = picotool

lib_deps =
    PrivateLib=symlink://src/lib/private
    PublicLib=symlink://src/lib/public

build_flags =
    -Ofast
    -finline
    -funroll-loops

build_unflags =
    -O2

check_tool = cppcheck, clangtidy

[env:main]
build_src_filter = +<main.cpp>

; TESTS
; TESTS:PICO

[env:pico_led]
build_src_filter = +<test/led.cpp>

[env:pico_lidar_lib]
build_src_filter = +<test/lidar_lib.cpp>

[env:pico_tof_sense]
build_src_filter = +<test/tof_sense.cpp>

[env:pico_tof_sense_test]
build_src_filter = +<test/tof_sense_test.cpp>

[env:pico_icm_lib]
build_src_filter = +<test/gyro_lib.cpp>

[env:pico_icm_test]
build_src_filter = +<test/gyro_test.cpp>

[env:pico_pid_test]
build_src_filter = +<test/pid.cpp>

[env:pico_uart_write]
build_src_filter = +<test/uart_write.cpp>

[env:pico_software_serial]
build_src_filter = +<test/software_serial_write.cpp>

[env:lidar_ring_test]
build_src_filter = +<test/lidar_ring_test.cpp>
