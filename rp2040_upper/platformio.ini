[platformio]
default_envs = main

[env]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
board = rpipico

framework = arduino

monitor_speed = 115200

upload_protocol = picotool

lib_deps =
    PrivateLib=symlink://src/lib/private
    PublicLib=symlink://src/lib/public

build_flags =
    -Ofast
    -finline
    -funroll-loops

build_unflags =
    -O2

check_tool = cppcheck, clangtidy

[env:main]
build_src_filter = +<main.cpp>

; TESTS
; TESTS:PICO

[env:pico_led]
build_src_filter = +<test/led.cpp>

[env:pico_vl53l5cx_test]
build_src_filter = +<test/lidar5.cpp>

[env:pico_vl53l5cx_lib]
build_src_filter = +<test/lidar5_lib.cpp>
