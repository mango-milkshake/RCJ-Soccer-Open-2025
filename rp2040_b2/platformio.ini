[platformio]
default_envs = main

[env]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
board = rpipico

framework = arduino

monitor_speed = 115200

upload_protocol = picotool

lib_deps =
    PrivateLib=symlink://src/lib/private
    PublicLib=symlink://src/lib/public

build_flags =
    -Ofast
    -finline
    -funroll-loops

build_unflags =
    -O2

check_tool = cppcheck, clangtidy

[env:main]
build_src_filter = +<main.cpp>

; TESTS
; TESTS:PICO

[env:pico_led]
build_src_filter = +<test/led.cpp>

[env:pico_i2c_write]
build_src_filter = +<test/i2c_write_pico.cpp>

[env:pico_analogmux]
build_src_filter = +<test/analogmux.cpp>

[env:tofsense_uart]
build_src_filter = +<test/tof_sense_uart.cpp>

[env:pico_kicker]
build_src_filter = +<test/kicker.cpp>
