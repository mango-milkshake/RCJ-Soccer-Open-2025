[platformio]
default_envs = main

[env]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
board = rpipico

framework = arduino

monitor_speed = 115200

upload_protocol = picotool

lib_deps =
    PrivateLib=symlink://src/lib/private
    PublicLib=symlink://src/lib/public
    Wire
    SPI

build_flags =
    -Ofast
    -finline
    -funroll-loops

build_unflags =
    -O2

check_tool = cppcheck, clangtidy

[env:main]
build_src_filter = +<main.cpp>

; TESTS
; TESTS:PICO

[env:pico_led]
build_src_filter = +<test/led.cpp>

[env:pico_motor_driver]
build_src_filter = +<test/motor_driver.cpp>

[env:pico_single_driver]
build_src_filter = +<test/md_single.cpp>

[env:pico_daisy_chain]
build_src_filter = +<test/md_daisy_chain.cpp>

[env:pico_drive]
build_src_filter = +<test/drive.cpp>

[env:pico_motor]
build_src_filter = +<test/motor.cpp>

[env:pico_i2c_read]
build_src_filter = +<test/i2c_read_pico.cpp>
